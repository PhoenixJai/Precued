spring:
  application:
    name: precued-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/precued}
    username: ${DATABASE_USER:precued}
    password: ${DATABASE_PASSWORD:precued}

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Hard backstop before a request body is even fully read into memory —
      # deliberately looser than precued.pdf.max-file-size-bytes below, which
      # does the real, precisely-messaged rejection. Keep this above that
      # value, never below it.
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

precued:
  web:
    # The frontend is deployed as a separate Railway service (a different
    # origin from this backend), so every browser fetch to /api/** is
    # cross-origin — see WebMvcConfig's addCorsMappings. Blank (the default)
    # allows nothing extra; local dev doesn't need this, since Vite's dev
    # proxy makes requests same-origin from the browser's perspective.
    allowed-origin: ${FRONTEND_ORIGIN:}
  livekit:
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    host: ${LIVEKIT_HOST:} # wss://<project>.livekit.cloud — LiveKitConfig derives the https:// REST URL from this itself
  auth:
    magic-link:
      # Was bound to a separate APP_BASE_URL env var that was never set in
      # production (FRONTEND_ORIGIN below only fed CORS) — magic links kept
      # silently linking to the http://localhost:5173 fallback. This is the
      # same "frontend's origin" value as precued.web.allowed-origin below;
      # one env var for both.
      base-url: ${FRONTEND_ORIGIN:http://localhost:5173}
      token-ttl-minutes: 15
      # Resend's HTTP API (not their SMTP relay — Railway blocks outbound
      # port 587). onboarding@resend.dev works unverified for testing
      # (delivers only to the account owner's own address); switch to a
      # verified sending domain's address for real use.
      from-address: ${MAIL_FROM_ADDRESS:onboarding@resend.dev}
      resend-api-key: ${RESEND_API_KEY:}
    account:
      # Deliberately its own config, separate from magic-link's session TTL
      # (AuthService's hardcoded 24h) even though both currently read 24h —
      # Account Holder sessions and guest room-tokens are different enough
      # (Auth & Account Overhaul) that they'll likely need to diverge later,
      # and this way that's a config change, not a migration.
      session-ttl-hours: 24
  invite:
    default-ttl-days: 7 # used when Invite.expires_at is not explicitly set and room hasn't ended
  storage:
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket-name: ${R2_BUCKET_NAME:}
  pdf:
    max-file-size-bytes: 26214400 # 25 MB — keep <= spring.servlet.multipart.max-file-size above
    max-pages: 100 # sync conversion has no job queue; this bounds one request's worst case
    render-dpi: 150 # slide-quality default; higher = larger images and longer render time per page
